<!DOCTYPE html>
<html lang="id">
<head>
    <!-- ========================================================= -->
    <!-- METADATA & KONFIGURASI HALAMAN                            -->
    <!-- ========================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Jurnal & Disiplin SMAN 1 Manyar</title>

    <!-- KONFIGURASI PWA UNTUK LAYAR PENUH (FULLSCREEN) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3498db">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Jurnal SMANEMA">

    <!-- ========================================================== -->
    <!-- STYLESHEETS & FONTS                                        -->
    <!-- ========================================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <!-- Favicon Sekolah -->
    <link rel="icon" href="https://raw.githubusercontent.com/Wahyudi-1/JurnalPembelajaranSMANEMA/main/Logo.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Wahyudi-1/JurnalPembelajaranSMANEMA/main/Logo.png">
</head>

<body class="login-page-v2">

    <!-- ========================================================== -->
    <!-- MAIN LOGIN CONTAINER                                       -->
    <!-- ========================================================== -->
    <div class="login-box">
        
        <!-- Kolom Kiri: Ilustrasi & Pesan Selamat Datang -->
        <div class="login-illustration">
            <div class="illustration-content">
                <img 
                    style="max-width: 150px; height: auto; margin-bottom: 1rem;"
                    src="https://raw.githubusercontent.com/Wahyudi-1/JurnalPembelajaranSMANEMA/main/Logo.png" 
                    alt="Logo Sekolah">
                <div class="login-branding">
                    <h4>Sistem Jurnal & Disiplin</h4>
                    <h5>SMAN 1 Manyar</h5>
                </div>
                
                <p style="margin-top: 1.5rem;">Akses cepat dan terpusat untuk mengelola data pengajaran dan catatan kedisiplinan siswa.</p>
            </div>
        </div>
        
        <!-- Kolom Kanan: Form Login -->
        <div class="login-form-container">
            <div class="login-form-content">
                
                <h2 class="logo">Selamat Datang</h2>
                <p style="color: var(--text-light); margin-bottom: 25px;">Silakan masuk untuk melanjutkan.</p>
                
                <form>
                    <div class="form-group">
                        <label for="username">Email</label>
                        <input type="email" id="username" placeholder="Masukkan alamat email Anda" required autocomplete="email">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="Masukkan password Anda" required autocomplete="current-password">
                            <span id="togglePassword" class="toggle-password-icon"></span>
                        </div>
                    </div>
                    
                    <div class="form-group" style="margin-top: 2rem;">
                        <button type="submit" id="loginButton" class="btn btn-primary btn-block">Login</button>
                    </div>

                    <div class="form-group" style="text-align: center; margin-top: 1rem;">
                        <a href="#" id="forgotPasswordLink" style="color: var(--primary-color); text-decoration: none; font-size: 0.9em;">Lupa Password?</a>
                    </div>
                    
                    <!-- TOMBOL INSTALL APLIKASI (DISEMBUNYIKAN SECARA DEFAULT) -->
                    <div class="form-group" style="text-align: center; margin-top: 2rem;">
                        <button type="button" id="installAppBtn" class="btn" style="display: none; background-color: #2ecc71; color: white; width: 100%; font-weight: 600;">
                            📲 Install Aplikasi di HP
                        </button>
                    </div>

                </form>
                
                <div id="statusMessage" class="status-message" style="display: none; margin-top: 15px;"></div>
            </div>
        </div>

    </div> <!-- End of .login-box -->

    <!-- ========================================================== -->
    <!-- RESET PASSWORD CONTAINER (SEMBUNYI SECARA DEFAULT)         -->
    <!-- ========================================================== -->
    <div id="resetPasswordContainer" class="login-box" style="display: none;">
        <div class="login-form-container" style="grid-column: 1 / -1;">
            <div class="login-form-content">
                <h2 class="logo">Atur Password Baru</h2>
                <p style="color: var(--text-light); margin-bottom: 25px;">Anda sedang dalam mode pemulihan akun. Silakan masukkan password baru Anda.</p>
                
                <form id="resetPasswordForm">
                    <div class="form-group">
                        <label for="newPassword">Password Baru</label>
                        <input type="password" id="newPassword" placeholder="Masukkan password baru (min. 6 karakter)" required>
                    </div>
                    
                    <div class="form-group" style="margin-top: 2rem;">
                        <button type="submit" class="btn btn-primary btn-block">Simpan Password Baru</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ELEMEN GLOBAL (LOADING OVERLAY) -->
    <div id="loadingIndicator" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <!-- Library untuk Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="auth.js"></script>

    <!-- SCRIPT KHUSUS UNTUK INSTALL PWA -->
    <script>
        // 1. Daftarkan Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('PWA Service Worker registered.', reg);
                }).catch(err => console.error('PWA SW Registration failed:', err));
            });
        }

        // 2. Tangkap event install dari Browser
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            // Mencegah banner default browser muncul
            e.preventDefault();
            // Simpan event untuk dipicu nanti saat tombol diklik
            deferredPrompt = e;
            // Munculkan tombol Install buatan kita
            installBtn.style.display = 'block';
        });

        // 3. Logika ketika tombol install diklik
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt !== null) {
                // Munculkan pop-up install native dari HP
                deferredPrompt.prompt();
                // Tunggu respon user
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('User menginstal aplikasi');
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Sembunyikan tombol jika sudah berhasil diinstal
        window.addEventListener('appinstalled', () => {
            installBtn.style.display = 'none';
        });
    </script>
</body>
</html>
